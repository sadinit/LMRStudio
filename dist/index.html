              '<p style="margin:0 0 14px;color:#52525b;font-size:14px;">Stai aprendo il file <code>index.html</code> sorgente senza compilazione Vite (<code>src/main.tsx</code> non viene eseguito direttamente dai browser statici).</p>' +
              '<ol style="margin:0;padding-left:20px;font-size:14px;color:#27272a;">' +
              '<li style="margin-bottom:8px;"><strong>Consigliato (automatico):</strong> su GitHub vai in <strong>Settings → Pages → Source</strong> e seleziona <strong>GitHub Actions</strong>. Il workflow incluso compilerà automaticamente l’app.</li>' +
              '<li><strong>Oppure manuale:</strong> esegui <code>npm install &amp;&amp; npm run build</code> e carica su GitHub Pages il contenuto della cartella <code>dist/</code> (oppure usa <em>Scarica index.html</em> dentro VetrinaKit).</li>' +
              '</ol>' +
              '</div>';
          }
        }, 1400);
